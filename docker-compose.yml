version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: novaric_paragon_postgres
    restart: always
    environment:
      POSTGRES_USER: novaric
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local}
      POSTGRES_DB: novaric_paragon
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/novaric_paragon_schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novaric -d novaric_paragon"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: novaric_paragon_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://novaric:${POSTGRES_PASSWORD:-change-me-local}@db:5432/novaric_paragon
      PORT: 8000
    ports:
      - "8000:8000"

  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: novaric_paragon_worker
    restart: always
    depends_on:
      db:
        condition: service_healthy
    command: python -m ingestion.kuvendi_odata

volumes:
  postgres_data:
