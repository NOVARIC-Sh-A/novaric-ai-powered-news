server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    # API endpoints returning JSON directly instead of SPA HTML fallback
    location /api/v1/news {
        default_type application/json;
        alias /usr/share/nginx/html/data/latestNews.json;
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","service":"novaric-media"}';
    }

    # SPA routing fallback & fresh index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Static assets hashing & long term cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Basic health check for Cloud Run
    location = /healthz {
        access_log off;
        return 200 "OK\n";
    }
}
